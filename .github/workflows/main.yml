name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    # Rocky Linux 8, as used on the ST40 PCS and the TE analysis servers.
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf -y install gcc make openblas-devel python3.12 python3.12-pip

      - name: Build and run the C unit tests
        run: make -C c test ARCH_FLAGS=

      - name: Install the Python package
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Check Python formatting and lint
        run: |
          .venv/bin/ruff format --check python tests
          .venv/bin/ruff check python tests

      - name: Check C formatting
        run: .venv/bin/clang-format --dry-run --Werror c/src/*.[ch] c/tests/*.[ch]

      - name: Run the off-network tests (analytic replay, data dictionary, settings, I/O, CLI)
        run: .venv/bin/pytest
